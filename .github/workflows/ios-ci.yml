name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # AirBorder uses Foundation Models, which requires Xcode 26.
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Standalone indoor replay driver tests
        run: python3 Scripts/tests/test_indoor_signal_emulator.py

      - name: Select and boot available iOS simulator
        run: python3 Scripts/select-ci-simulator.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: ./Scripts/generate.sh

      - name: Build
        run: |
          xcodebuild \
            -project AirBorder.xcodeproj \
            -scheme AirBorder \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          xcodebuild \
            -project AirBorder.xcodeproj \
            -scheme AirBorder \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            test -only-testing:AirportXRCompanionTests

      - name: UI tests
        run: |
          xcodebuild \
            -project AirBorder.xcodeproj \
            -scheme AirBorder \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            test -only-testing:AirportXRCompanionUITests -skip-testing:AirportXRCompanionUITests/IndoorReplayIntegrationTests

      - name: Indoor replay and iOS simulator integration
        run: |
          python3 Scripts/test-with-indoor-driver.py xcodebuild \
            -project AirBorder.xcodeproj \
            -scheme AirBorder \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test -only-testing:AirportXRCompanionUITests/IndoorReplayIntegrationTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: warn
